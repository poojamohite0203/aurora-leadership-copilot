version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - POSTGRES_HOST=db.dzccpqzffwbwrzuupcfh.supabase.co
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgred-password
      - POSTGRES_DB=leadership
      - OPENAI_API_KEY=your-api-key

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - AURORA_API_URL=http://backend:8000
